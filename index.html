<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather detection </title> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="Enter the City Name" spellcheck="false">
            <button><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        <div class="weather">
           <img src="pngtree-d-weather-icon-with-sun-cloud-and-raindrops-png-image_14853731-removebg-preview.png"  class ="icon "alt="">
            <h1 class ="temp">27°c</h1>
        <h2 class = "city"> NEW YORK</h2>
       </div> <div class = "detail">
        <div class="detailbox">
            <div class="col">
                <img src="e67172f0e1e266098ae55b7f057c0761-removebg-preview.png" alt="">
            </div><div>
            <p class = "humadity">50%</p>
            <p>Humadity</p>
        </div></div>
                
        <div class="detailbox">
            <div class="col">
                <img src="depositphotos_75718829-stock-illustration-blowing-wind-icon-removebg-preview.png" alt="">
            </div><div>
            <p class ="wind">15km/h</p>
            <p>Wind Speed</p>
        </div></div>
    </div>
    </div>


    <script>
        const apiKey ="62c7b7ec366d6f397e289d087be3f4f2&units=metric";
        const apiurl = "https://api.openweathermap.org/data/2.5/weather?q=";

       const searchbox = document.querySelector(".search input");
       const searchbut = document.querySelector(".search button");
       const Icon = document.querySelector(".icon");
        async function checkWeather (city) {
            const response =await fetch(apiurl +city+'&APPID='+apiKey);
                var data = await response.json();
                console.log(data);
                document.querySelector(".city").innerHTML = data.name;
                document.querySelector(".temp").innerHTML = Math.round(data.main.temp)+ "°c";
                document.querySelector(".humadity").innerHTML = data.main.humidity + "%";
                document.querySelector(".wind").innerHTML = data.wind.speed +" km/h"; 
                if (data.weather[0].main=="Clouds"){
                    Icon.src ="4834559-removebg-preview.png";
                }
              else   if (data.weather[0].main=="Clear"){
                    Icon.src ="images-removebg-preview.png";
                }
             else    if (data.weather[0].main=="Mist"){
                    Icon.src ="weather.png";
                }
                else    if (data.weather[0].main=="Rain"){
                    Icon.src ="images-removebg-preview (1).png";
                }
                else    if (data.weather[0].main=="Drizzles"){
                    Icon.src ="6142637-removebg-preview.png";
                }
                else    if (data.weather[0].main=="Snow"){
                    Icon.src ="pngtree-d-weather-icon-with-sun-cloud-and-raindrops-png-image_14853731-removebg-preview.png";
                }
            }
           
            searchbut.addEventListener("click",()=>{
                 checkWeather(searchbox.value); 
             })

       
    </script>
</body>
</html>
